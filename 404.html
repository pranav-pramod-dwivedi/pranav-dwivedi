<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 — Lost in Rewa — Pranav Dwivedi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="This page doesn't exist. Head back to the home ground.">
<link rel="canonical" href="https://pranav-dwivedi.pages.dev/404">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<style>
  :root{--bg:#07090e;--fg:#e8ecf1;--dim:#5b6472;--line:#1a2028;--acc:#9cc4ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:400 16px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  a{color:var(--acc);text-decoration:none;border-bottom:1px solid rgba(156,196,255,.35)}
  .stage{display:flex;flex-direction:column;align-items:center;gap:2.25rem;padding:2rem;text-align:center}

  /* ---------- the 0 orbiting trio ---------- */
  .glyphs{display:flex;align-items:baseline;gap:.06em;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:clamp(4.5rem,17vw,11rem);font-weight:300;letter-spacing:.02em}
  .glyph{position:relative;display:inline-block;color:var(--fg)}
  .glyph.l::after,.glyph.r::after{
    content:"";position:absolute;top:50%;left:43%;width:1px;height:0;
    transform:translate(-50%,-50%) rotate(45deg);background:var(--acc);
    animation:slash 4.2s cubic-bezier(.6,.08,.34,1) infinite}
  .glyph.r::after{animation-delay:2.1s}
  @keyframes slash{
    0%{height:0;opacity:0}
    12%{height:0;opacity:1}
    55%{height:140%;opacity:1}
    62%{height:140%;opacity:1;background:var(--acc)}
    63%{background:#ff6b6b}
    100%{height:140%;opacity:0;background:#ff6b6b}}

  /* ---------- field of drifting seeds ---------- */
  .field{position:fixed;inset:0;pointer-events:none;z-index:-1}
  .seed{position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--fg);opacity:0}
  .seed:nth-child(1){left:12%;animation:drift 26s linear 1s infinite}
  .seed:nth-child(2){left:28%;animation:drift 22s linear 6s infinite}
  .seed:nth-child(3){left:64%;animation:drift 30s linear 3s infinite}
  .seed:nth-child(4){left:80%;animation:drift 24s linear 11s infinite}
  .seed:nth-child(5){left:91%;animation:drift 28s linear 8s infinite}
  @keyframes drift{
    0%{transform:translateY(105vh) translateX(0);opacity:0}
    8%{opacity:.45}
    90%{opacity:.45}
    100%{transform:translateY(-8vh) translateX(24px);opacity:0}}

  /* ---------- copy ---------- */
  .status{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;
    letter-spacing:.42em;text-transform:uppercase;color:var(--dim)}
  .status em{font-style:normal;color:var(--acc)}
  h1{font-size:1.05rem;font-weight:500;letter-spacing:.01em;color:var(--dim)}
  h1 b{color:var(--fg);font-weight:600}
  .back{opacity:0;transform:translateY(8px);animation:rise .8s ease 2.6s forwards}
  .back a{padding:.15rem .1rem;transition:border-color .2s}
  .back a:hover{border-bottom-color:var(--acc)}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .back{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="field" aria-hidden="true"><i class="seed"></i><i class="seed"></i><i class="seed"></i><i class="seed"></i><i class="seed"></i></div>

<main class="stage">
  <div class="glyphs" aria-label="Error 404" role="img">
    <span class="glyph l" aria-hidden="true">4</span><span class="glyph" aria-hidden="true">0</span><span class="glyph r" aria-hidden="true">4</span>
  </div>
  <p class="status">Error <em>404</em> · Request dispatched · Ball lost</p>
  <h1>This page took a <b>bouncer</b> and never recovered.</h1>
  <p class="back"><a href="/">← Back to the home ground</a></p>
</main>
<script>if(location.pathname!=="/404"&&window.history.replaceState)history.replaceState(null,"","/404");</script>
</body>
</html>
